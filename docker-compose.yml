services:
  db:
    image: postgres:16-alpine
    container_name: inzynierka-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inzynierka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inzynierka}
      POSTGRES_DB: ${POSTGRES_DB:-inzynierka}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inzynierka} -d ${POSTGRES_DB:-inzynierka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: inzynierka-api
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inzynierka}:${POSTGRES_PASSWORD:-inzynierka}@db:5432/${POSTGRES_DB:-inzynierka}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-zmien-to-lokalnie}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-Gabinet Dermatologiczny <noreply@gabinet.local>}
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: inzynierka-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: inzynierka-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
